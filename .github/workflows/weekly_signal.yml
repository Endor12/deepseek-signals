name: Weekly S&P 500 Forward Signal

on:
  schedule:
    # Sonntag 18:00 UTC = 20:00 Uhr deutsche Sommerzeit (MESZ)
    - cron: "0 18 * * 0"
  workflow_dispatch:   # Manuell auslösbar über GitHub → Actions → "Run workflow"

permissions:
  contents: write   # Erlaubt dem Workflow, forward_signals.json zurück ins Repo zu committen

jobs:
  generate-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pakete installieren
        run: pip install --quiet openai yfinance pandas numpy

      - name: Forward Signal generieren
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python forward_signal.py

      - name: Änderungen committen und pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forward_signals.json forward_log.txt
          # Nur committen wenn tatsächlich Änderungen vorhanden sind
          if git diff --cached --quiet; then
            echo "Keine Änderungen — kein Commit nötig."
          else
            git commit -m "signal: weekly S&P 500 scan $(date -u '+%Y-%m-%d')"
            git push
          fi
