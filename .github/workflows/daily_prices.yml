name: Daily Portfolio Price Update

on:
  schedule:
    # Mo-Fr 22:00 UTC = nach US-Marktschluss (16:00 EDT / 21:00 UTC + Puffer)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:   # Manuell auslösbar über GitHub → Actions → "Run workflow"

permissions:
  contents: write   # Erlaubt dem Workflow, portfolio_state.json zurück ins Repo zu committen

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Pakete installieren
        run: pip install --quiet -r requirements.txt

      - name: Kurse aktualisieren
        run: python update_prices.py

      - name: Änderungen committen und pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_state.json
          # Nur committen wenn tatsächlich Änderungen vorhanden sind
          if git diff --cached --quiet; then
            echo "Keine Änderungen — kein Commit nötig."
          else
            git commit -m "prices: daily portfolio valuation $(date -u '+%Y-%m-%d')"
            git push
          fi
